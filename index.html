<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Meta -->
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Happy Friendship Day 💙</title>

    <meta name="description"
          content="Create a beautiful animated Friendship Day card for your best friend.">

    <meta name="theme-color"
          content="#6c63ff">

    <!-- Open Graph -->
    <meta property="og:title"
          content="Happy Friendship Day 💙">

    <meta property="og:description"
          content="Generate a beautiful Friendship Day greeting card.">

    <meta property="og:type"
          content="website">

    <!-- Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
          href="friendship.css">
</head>

<body>

    <!-- =========================
         Animated Background
    ========================== -->

    <div class="gradient-bg"
         id="gradientBg"></div>

    <div class="glow-layer"
         id="glowLayer"
         aria-hidden="true">

        <span class="glow-blob blob-1"></span>
        <span class="glow-blob blob-2"></span>
        <span class="glow-blob blob-3"></span>
        <span class="glow-blob blob-4"></span>

    </div>

    <div class="stars-layer"
         id="starsLayer"
         aria-hidden="true"></div>

    <div class="floating-layer"
         id="floatingLayer"
         aria-hidden="true"></div>

    <canvas id="confettiCanvas"
            class="confetti-canvas"
            aria-hidden="true"></canvas>

    <!-- =========================
         Main Section
    ========================== -->

    <main class="stage">

        <section class="card-container"
                 id="cardContainer">

            <article class="card"
                     id="card">

                <!-- FRONT -->

                <section class="card-face card-front"
                         aria-labelledby="mainHeading">

                    <p class="eyebrow">
                        ✨ A little surprise for someone special
                    </p>

                    <h1 class="title"
                        id="mainHeading">

                        Happy Friendship Day

                        <span class="title-heart"
                              aria-hidden="true">
                            💙
                        </span>

                    </h1>

                    <p class="subtitle">
                        Some friendships make life more beautiful.
                    </p>

                    <form id="surpriseForm"
                          class="form"
                          autocomplete="off"
                          novalidate>

                        <div class="input-group">

                            <label for="yourName">
                                Your Name
                            </label>

                            <input
                                id="yourName"
                                name="yourName"
                                type="text"
                                maxlength="30"
                                placeholder="Enter your name"
                                spellcheck="false"
                                required>

                        </div>

                        <div class="input-group">

                            <label for="friendName">
                                Friend's Name
                            </label>

                            <input
                                id="friendName"
                                name="friendName"
                                type="text"
                                maxlength="30"
                                placeholder="Enter friend's name"
                                spellcheck="false"
                                required>

                        </div>

                        <p id="formError"
                           class="form-error"
                           role="alert"
                           aria-live="polite">

                            Please enter both names.

                        </p>

                        <button
                            id="generateBtn"
                            class="btn btn-primary"
                            type="submit"
                            aria-label="Generate Friendship Card">

                            Open Your Friendship Card 💙

                        </button>

                    </form>

                </section>

                <!-- BACK -->

                <section class="card-face card-back"
                         aria-labelledby="messageHeading">

                    <h2 id="messageHeading"
                        class="visually-hidden">

                        Friendship Message

                    </h2>

                    <div id="messageContent"
                         class="message-content"></div>

                    <blockquote
                        id="quote"
                        class="quote"></blockquote>

                    <div class="action-buttons">

                        <button
                            id="copyBtn"
                            class="btn btn-ghost"
                            type="button">

                            📋 Copy

                        </button>

                        <button
                            id="downloadBtn"
                            class="btn btn-ghost"
                            type="button">

                            ⬇ Download

                        </button>

                        <button
                            id="shareBtn"
                            class="btn btn-ghost"
                            type="button">

                            🔗 Share

                        </button>

                        <button
                            id="resetBtn"
                            class="btn btn-reset"
                            type="button">

                            ↺ Create Another

                        </button>

                    </div>

                    <button
                        id="nextSlideBtn"
                        class="next-slide-btn"
                        type="button">

                        One More Surprise

                        <span class="chevron"
                              aria-hidden="true">

                            ›

                        </span>

                    </button>

                </section>

            </article>

        </section>

    </main>

    <!-- =========================
         Sticker Slide
    ========================== -->

    <section
        id="stickerStage"
        class="sticker-stage"
        aria-hidden="true">

        <button
            id="stickerBackBtn"
            class="nav-arrow"
            type="button"
            aria-label="Back">

            ‹

        </button>

        <article
            class="sticker-card"
            id="stickerCard">

            <div class="paper-grain"></div>

            <div class="sticker-deco">

                <span class="deco d1">❤️</span>
                <span class="deco d2">⭐</span>
                <span class="deco d3">⭐</span>
                <span class="deco d4">💛</span>
                <span class="deco d5">✨</span>
                <span class="deco d6">🩷</span>
                <span class="deco d7">💫</span>

            </div>

            <div class="cutout-heading">

                <div id="cutoutRow1"
                     class="cutout-row"></div>

                <div id="cutoutRow2"
                     class="cutout-row"></div>

            </div>

            <div class="sticker-actions">

                <button
                    id="stickerDownloadBtn"
                    class="btn btn-ghost"
                    type="button">

                    ⬇ Download

                </button>

                <button
                    id="stickerShareBtn"
                    class="btn btn-ghost"
                    type="button">

                    🔗 Share

                </button>

                <button
                    id="stickerResetBtn"
                    class="btn btn-reset"
                    type="button">

                    ↺ Create Another

                </button>

            </div>

        </article>

    </section>

    <!-- Toast -->

    <div id="toast"
         class="toast"
         role="status"
         aria-live="polite"></div>

    <!-- JavaScript -->

    <script src="friendship.js" defer></script>

</body>

</html>
