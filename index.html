<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ======================================================
         BASIC META
    ======================================================= -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Happy Friendship Day 💙</title>

    <meta name="description"
          content="A beautiful animated Friendship Day surprise card with glassmorphism, 3D flip animation, confetti, stars, scrapbook page and sharing support.">

    <meta name="keywords"
          content="Friendship Day, Greeting Card, Friendship, HTML, CSS, JavaScript, Surprise Card">

    <meta name="author"
          content="Krrish Deep Singh">


    <!-- ======================================================
         THEME
    ======================================================= -->

    <meta name="theme-color"
          content="#6C63FF">

    <meta name="color-scheme"
          content="light dark">


    <!-- ======================================================
         OPEN GRAPH
    ======================================================= -->

    <meta property="og:title"
          content="Happy Friendship Day 💙">

    <meta property="og:description"
          content="Celebrate Friendship Day with a beautiful interactive animated greeting card.">

    <meta property="og:type"
          content="website">

    <meta property="og:image"
          content="assets/preview.png">


    <!-- ======================================================
         TWITTER
    ======================================================= -->

    <meta name="twitter:card"
          content="summary_large_image">

    <meta name="twitter:title"
          content="Happy Friendship Day 💙">

    <meta name="twitter:description"
          content="Interactive Friendship Day Greeting Card">


    <!-- ======================================================
         FAVICON
    ======================================================= -->

    <link rel="icon"
          type="image/png"
          href="assets/favicon.png">


    <!-- ======================================================
         PRECONNECT
    ======================================================= -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>


    <!-- ======================================================
         GOOGLE FONTS
    ======================================================= -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap"
          rel="stylesheet">


    <!-- ======================================================
         STYLESHEET
    ======================================================= -->

    <link rel="stylesheet"
          href="friendship.css">


    <!-- ======================================================
         HTML2CANVAS
    ======================================================= -->

    <script defer
            src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>


    <!-- ======================================================
         MAIN SCRIPT
    ======================================================= -->

    <script defer
            src="friendship.js">
    </script>

</head>

<body>
<!-- ======================================================
     BACKGROUND LAYERS
====================================================== -->

<div id="gradientBg"
     class="gradient-bg"
     aria-hidden="true">
</div>

<div id="glowLayer"
     class="glow-layer"
     aria-hidden="true">

    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>
    <div class="glow-blob blob-3"></div>
    <div class="glow-blob blob-4"></div>

</div>

<div id="starsLayer"
     class="stars-layer"
     aria-hidden="true">
</div>

<div id="floatingLayer"
     class="floating-layer"
     aria-hidden="true">
</div>


<!-- ======================================================
     CONFETTI CANVAS
====================================================== -->

<canvas id="confettiCanvas"
        class="confetti-canvas"
        aria-hidden="true">
</canvas>


<!-- ======================================================
     MAIN STAGE
====================================================== -->

<main class="stage"
      id="stage">

    <section class="card-container">

        <!-- =============================================
             3D CARD
        ============================================== -->

        <article class="card"
                 id="card">

            <!-- =========================================
                 FRONT
            ========================================== -->

            <section class="card-face card-front">

                <p class="eyebrow">
                    Friendship Day Special
                </p>

                <h1 class="title">

                    Happy Friendship Day

                    <span class="title-heart">
                        💙
                    </span>

                </h1>

                <p class="subtitle">

                    Enter both names and unlock
                    a beautiful Friendship Day
                    surprise.

                </p>

                <!-- =====================================
                     FORM
                ====================================== -->

                <form id="surpriseForm"
                      class="form"
                      autocomplete="off"
                      novalidate>

                    <!-- Your Name -->

                    <div class="input-group">

                        <label for="yourName">

                            Your Name

                        </label>

                        <input
                            id="yourName"
                            type="text"
                            maxlength="30"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <!-- Friend Name -->

                    <div class="input-group">

                        <label for="friendName">

                            Friend's Name

                        </label>

                        <input
                            id="friendName"
                            type="text"
                            maxlength="30"
                            placeholder="Enter your friend's name"
                            required>

                    </div>


                    <!-- Error -->

                    <div id="formError"
                         class="form-error"
                         aria-live="polite">
                    </div>


                    <!-- Buttons -->

                    <div class="action-buttons">

                        <button
                            id="generateBtn"
                            class="btn btn-primary"
                            type="submit">

                            Generate Surprise ✨

                        </button>

                    </div>

                </form>

            </section>


            <!-- =========================================
                 BACK
            ========================================== -->

            <section class="card-face card-back">

                <div id="messageContent"
                     class="message-content">

                    <h2 class="message-title">

                        Happy Friendship Day 💙

                    </h2>

                </div>

                <blockquote
                    id="quote"
                    class="quote">
                </blockquote>

                <div class="action-buttons">

                    <button
                        id="copyBtn"
                        class="btn btn-ghost"
                        type="button">

                        📋 Copy

                    </button>

                    <button
                        id="shareBtn"
                        class="btn btn-ghost"
                        type="button">

                        📤 Share

                    </button>

                    <button
                        id="downloadBtn"
                        class="btn btn-primary"
                        type="button">

                        📥 Download

                    </button>

                    <button
                        id="resetBtn"
                        class="btn btn-reset"
                        type="button">

                        🔄 Reset

                    </button>

                </div>

                <button
                    id="nextSlideBtn"
                    class="next-slide-btn"
                    type="button">

                    Next Surprise

                    <span class="chevron">

                        →

                    </span>

                </button>

            </section>

        </article>

    </section>

</main>
<!-- ======================================================
     STICKER / SCRAPBOOK PAGE
====================================================== -->

<section id="stickerStage"
         class="sticker-stage"
         aria-hidden="true">

    <article id="stickerCard"
             class="sticker-card">

        <!-- Paper Texture -->

        <div class="paper-grain"></div>

        <!-- Decorative Stickers -->

        <div class="sticker-deco"
             aria-hidden="true">

            <span class="deco d1">💙</span>
            <span class="deco d2">⭐</span>
            <span class="deco d3">🌸</span>
            <span class="deco d4">✨</span>
            <span class="deco d5">🦋</span>
            <span class="deco d6">🎈</span>
            <span class="deco d7">🌈</span>

        </div>


        <!-- Back Button -->

        <button id="stickerBackBtn"
                class="nav-arrow"
                type="button"
                aria-label="Go Back">

            ←

        </button>


        <!-- Heading -->

        <div class="cutout-heading">

            <div id="cutoutRow1"
                 class="cutout-row">
            </div>

            <div id="cutoutRow2"
                 class="cutout-row">
            </div>

        </div>


        <!-- Greeting -->

        <section class="message-content">

            <h2 class="message-title">

                Forever Friends 💙

            </h2>

            <p class="message-subtitle">

                True friendship is one of life's
                greatest treasures. Thank you for
                being part of this beautiful journey.

            </p>

        </section>


        <!-- Sticker Actions -->

        <div class="sticker-actions">

            <button id="stickerShareBtn"
                    class="btn btn-ghost"
                    type="button">

                📤 Share Sticker

            </button>

            <button id="stickerDownloadBtn"
                    class="btn btn-primary"
                    type="button">

                📥 Download Sticker

            </button>

            <button id="stickerResetBtn"
                    class="btn btn-reset"
                    type="button">

                🔄 Create Another

            </button>

        </div>

    </article>

</section>


<!-- ======================================================
     TOAST
====================================================== -->

<div id="toast"
     class="toast"
     role="status"
     aria-live="polite"
     aria-atomic="true">
</div>


<!-- ======================================================
     NOSCRIPT
====================================================== -->

<noscript>

    <div style="
        position:fixed;
        inset:0;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:24px;
        background:#ffffff;
        color:#222;
        font-family:Poppins,sans-serif;
        text-align:center;
        z-index:9999;">

        This Friendship Day card requires JavaScript
        to display animations and interactive
        features. Please enable JavaScript and
        reload the page.

    </div>

</noscript>


</body>

</html>
